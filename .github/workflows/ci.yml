# The checks CLAUDE.md asks for before a change is called working, run on
# every pull request and every push to main - on Linux only, the cheapest
# runner, so a broken change is found when it is made and not when a tag is
# pushed. The release workflow runs the same checks on all three platforms.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      # eframe needs the windowing/clipboard stack, and keyring needs
      # libsecret, neither of which the runner image ships.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libssl-dev libsecret-1-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with plugins
        run: cargo clippy --all-targets --features plugins -- -D warnings
      - name: Test
        run: cargo test --lib --tests
      - name: Test with plugins
        run: cargo test --features plugins --lib --tests
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
